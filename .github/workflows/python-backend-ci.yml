name: Python Backend CI/CD

on:
  push:
    branches: [ main, develop, test-copilot ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 -
        echo "$HOME/.local/bin" >> $GITHUB_PATH
    
    - name: Cache Poetry dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cache/pypoetry
          ~/.cache/pip
        key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
        restore-keys: |
          ${{ runner.os }}-poetry-
    
    - name: Install dependencies
      working-directory: ./guidogerb/app/backend-python
      run: |
        poetry install --with dev
    
    - name: Run linting (Ruff)
      working-directory: ./guidogerb/app/backend-python
      run: |
        poetry run ruff check src/ tests/
    
    - name: Run formatting check (Black)
      working-directory: ./guidogerb/app/backend-python
      run: |
        poetry run black --check src/ tests/
    
    - name: Run type checking (mypy)
      working-directory: ./guidogerb/app/backend-python
      run: |
        poetry run mypy src/ || true
    
    - name: Run tests with coverage
      working-directory: ./guidogerb/app/backend-python
      run: |
        poetry run pytest tests/ --cov=app --cov-report=xml --cov-report=term
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./guidogerb/app/backend-python/coverage.xml
        flags: backend
        name: backend-python-${{ matrix.python-version }}

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./guidogerb/app/backend-python
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/guidogerb-backend:latest
          ${{ secrets.DOCKER_USERNAME }}/guidogerb-backend:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Deploy to production
      run: |
        echo "Add deployment steps here (e.g., trigger deployment to AWS, GCP, etc.)"
