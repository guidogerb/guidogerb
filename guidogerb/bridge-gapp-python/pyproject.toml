[tool.poetry]
name = "bridge-gapp"
version = "0.1.0"
description = "Database bridge and gateway application"
authors = ["Gary Gerber <email@example.com>"]
readme = "README.md"
packages = [{include = "app", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.1"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
sqlalchemy = "^2.0.23"
pydantic = "^2.5.0"
asyncpg = "^0.29.0"
pymysql = "^1.1.0"
psycopg2-binary = "^2.9.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
