version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guidogerb-backend
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://guidogerb:password@db:5432/guidogerb
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=True
      - ENVIRONMENT=development
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload
    networks:
      - app-network

  db:
    image: postgres:15-alpine
    container_name: guidogerb-db
    environment:
      - POSTGRES_USER=guidogerb
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=guidogerb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guidogerb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: guidogerb-redis
    ports:
      - "6379:6379"
    networks:
      - app-network

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: guidogerb-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
